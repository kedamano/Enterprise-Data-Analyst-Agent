services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
    depends_on:
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Agent 自身元数据存储（长期记忆，spec §20 Memory 的 PG 后端）
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=da
      - POSTGRES_PASSWORD=da
      - POSTGRES_DB=da_agent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U da -d da_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Milvus Standalone 依赖 etcd（元数据）+ MinIO（对象存储），二者不是业务微服务。
  #
  # 镜像 tag 说明：以下三个 tag 是**本机已有镜像**，因此 `docker compose up -d` 无需联网拉取。
  # 若你的环境有可用的镜像源，可自行升到更新的 tag（Milvus 官方 compose 用的就是更新版本）。
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./data/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    # MINIO_ACCESS_KEY/MINIO_SECRET_KEY 已废弃（启动日志会告警），改用 ROOT_* 变量。
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./data/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - ./data/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      # 9091：健康/指标端口。没有它 healthcheck 无从下手，也会让 app 在
      # Milvus 尚未就绪时就启动（官方文档明确提示"首次启动可能需数十秒"）。
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_started
    # 首次启动要建元数据，start_period 给足时间，避免被误判为不健康。
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
