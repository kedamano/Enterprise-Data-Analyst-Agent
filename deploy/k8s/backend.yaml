apiVersion: v1
kind: Service
metadata:
  name: edaa-backend
  namespace: edaa
  labels:
    app: edaa
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: edaa
    component: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edaa-backend
  namespace: edaa
  labels:
    app: edaa
    component: backend
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edaa
      component: backend
      version: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: edaa
        component: backend
        version: blue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo 'waiting for postgres...'; sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo 'waiting for redis...'; sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      containers:
        - name: backend
          image: edaa/backend:latest
          ports:
            - containerPort: 8000
              protocol: TCP
              name: http
          envFrom:
            - configMapRef:
                name: edaa-config
            - secretRef:
                name: edaa-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              component: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edaa-backend-hpa
  namespace: edaa
  labels:
    app: edaa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edaa-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
