apiVersion: v1
kind: ConfigMap
metadata:
  name: edaa-config
  namespace: edaa
  labels:
    app: edaa
data:
  # FastAPI
  APP_ENV: "production"
  APP_PORT: "8000"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  # LLM
  LLM_ENDPOINT: "https://api.openai.com/v1"
  LLM_MODEL: "gpt-4o-mini"
  LLM_TEMPERATURE: "0.1"
  # CORS
  CORS_ORIGINS: "https://edaa.example.com"
  # Redis / ARQ
  REDIS_DB: "0"
  ARQ_QUEUE_NAME: "edaa_tasks"
  # Postgres
  POSTGRES_DB: "edaa"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  # Ingress
  DOMAIN: "edaa.example.com"
