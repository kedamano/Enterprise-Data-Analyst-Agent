# Alembic configuration for EDAA schema migrations
# Usage:
#   python scripts/run_migrations.py --help
#   python scripts/run_migrations.py revision --autogenerate -m "add column X"
#   python scripts/run_migrations.py upgrade head
#   python scripts/run_migrations.py downgrade -1
#   python scripts/run_migrations.py current
#   python scripts/run_migrations.py history

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# DATABASE_URL is read from env (falls back to data/db/metadata.db)
# Test DBs are cleaned by conftest; this tool targets persistent DBs only
sqlalchemy.url = sqlite:///./data/db/metadata.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
