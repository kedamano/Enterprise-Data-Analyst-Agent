<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052.265 548" width="1052.265" height="548" style="--bg:#1a1b26;--fg:#a9b1d6;--line:#3d59a1;--accent:#7aa2f7;--muted:#565f89;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 30%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="4.8" refX="8" refY="2.4" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.4, 0 4.8" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="4.8" refX="8" refY="2.4" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.4, 0 4.8" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<rect x="76.565" y="198" width="945.7" height="220" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
<rect x="76.565" y="198" width="118.08" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="82.565" y="207" dy="0.35em" font-size="11" font-weight="600" fill="var(--_text-sec)">loop [每完成一个编排节点]</text>
<line x1="126.565" y1="70" x2="126.565" y2="518" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="286.915" y1="70" x2="286.915" y2="518" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="548.3900000000001" y1="70" x2="548.3900000000001" y2="518" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="809.865" y1="70" x2="809.865" y2="518" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="971.24" y1="70" x2="971.24" y2="518" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="126.565" y1="90" x2="286.915" y2="90" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="206.74" y="84" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">输入业务问题并回车</text>
<line x1="286.915" y1="130" x2="548.3900000000001" y2="130" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="417.65250000000003" y="124" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">POST {query, session_id, stream:true, history:最近12条}（fetch + AbortController）</text>
<line x1="548.3900000000001" y1="170" x2="809.865" y2="170" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="679.1275" y="164" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">逐节点驱动 AgentState</text>
<line x1="809.865" y1="238" x2="971.24" y2="238" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="890.5525" y="232" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">状态快照(status/message/objective)</text>
<line x1="809.865" y1="278" x2="971.24" y2="278" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="890.5525" y="272" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">EXECUTE 时附 step 明细(tool/digest/error/耗时)</text>
<line x1="809.865" y1="318" x2="971.24" y2="318" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="890.5525" y="312" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">FINISH 时附 report</text>
<line x1="971.24" y1="358" x2="286.915" y2="358" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="629.0775" y="352" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">data:{...} (SSE)</text>
<line x1="286.915" y1="398" x2="126.565" y2="398" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="206.74" y="392" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">实时渲染：阶段卡 → 工具轨迹(可展开日志) → 业务报告</text>
<line x1="286.915" y1="438" x2="971.24" y2="438" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="629.0775" y="432" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">[DONE]</text>
<line x1="126.565" y1="478" x2="286.915" y2="478" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="206.74" y="472" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">点「停止」→ AbortController 中断本次分析</text>
<rect x="30" y="442" width="353.48" height="27" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<polygon points="377.48,442 383.48,448 377.48,448" fill="var(--_inner-stroke)" />
<text x="206.74" y="455.5" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">多轮对话：再次提问携带最近12条 + session_id；&lt;br/&gt;服务端按 session 追加短期记忆与长期结论</text>
<rect x="86.565" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="126.565" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">用户(业务)</text>
<rect x="206.565" y="30" width="160.70000000000002" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="286.915" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">React 前端(web/dist)</text>
<rect x="407.2650000000001" y="30" width="282.25" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="548.3900000000001" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">FastAPI /api/v1/chat/analyze/stream</text>
<rect x="729.515" y="30" width="160.70000000000002" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="809.865" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">stream_analysis 编排</text>
<rect x="930.215" y="30" width="82.05000000000001" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="971.24" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">SSE 事件流</text>
</svg>